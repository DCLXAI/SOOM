version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Seoul
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: bun
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Seoul
    groups:
      worker-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /share-web
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Seoul
    groups:
      share-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: bun
    directory: /transcoder
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Seoul
    groups:
      transcoder-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /transcoder
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
